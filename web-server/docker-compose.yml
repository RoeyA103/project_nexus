version: '3.8'

services:
  # מסד הנתונים (MySQL)
  db:
    image: mysql:8.0
    container_name: shop_db
    environment:
      MYSQL_DATABASE: shop_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # השרת (Node.js API)
  backend:
    build: ./backend
    container_name: shop_backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: shop_db

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    ports:
      - "4000:4000"
    restart: always

  # האתר (React/Vite)
  frontend:
    build: ./frontend
    container_name: shop_frontend
    ports:
      - "3000:3000"

  # השומר בכניסה (Nginx)
  nginx:
    image: nginx:latest
    container_name: shop_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: always