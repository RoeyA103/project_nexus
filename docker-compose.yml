version: '3.8'

services:
  # # --- תשתית נתונים (Kafka & Elastic) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
       - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl --fail http://localhost:9200/_cat/health?h=st | grep -E 'green|yellow'",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s


  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_kraft:/var/lib/kafka/data

  # --- שירותי הלוגים (האפליקציות שלך) ---
  log_shipper:
    build: ./app_logs_sender/log_shipper
    container_name: log_shipper
    volumes:
      # חיבור לתיקיית הלוגים של ה-Backend
      - ./web-server/backend/logs:/app/logs:ro
    environment:
      - PYTHONUNBUFFERED=1
      - BOOTSTRAP_SERVERS=kafka:9092
      - TOPIC_NAME=logs
      - FILE_PATH=/app/logs/app.log # וודא שזה השם שה-Backend מייצר
    depends_on:
      kafka:
        condition: service_healthy

  to_elastic:
    build: ./app_logs_sender/to_elastic
    container_name: to_elastic
    environment:
      - PYTHONUNBUFFERED=1
      - BOOTSTRAP_SERVERS=kafka:9092
      - TOPIC_NAME=logs
      - GROUP_ID=logs
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - INDEX_NAME=project_logs
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nginx_producer_log:
    build: ./publish
    container_name: nginx-producer
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC_NGINX: nginx-logs
      NGINX_LOG_PATH: /app/logs/access.log
    volumes:
      - ./web-server/logs:/app/logs:ro
  
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  nginx_consumer_log:
    build: ./consumer
    container_name: nginx-consumer
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NGINX: nginx-logs
      ES_HOST: http://elasticsearch:9200
      ES_BATCH_SIZE: 50
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy




  # --- אפליקציית ה-Shop ---
  db:
    image: mysql:8.0
    container_name: shop_db
    environment:
      MYSQL_DATABASE: shop_db
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      retries: 10
    ports:
      - "3306:3306"

  backend:
    build: ./web-server/backend
    container_name: shop_backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: shop_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web-server/backend/logs:/app/logs # כאן ה-Backend כותב את הלוגים
    restart: always
    ports:
    - "4000:4000"

  frontend:
    build: ./web-server/frontend
    container_name: shop_frontend
    restart: always
    ports:
    - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: shop_proxy
    ports:
      - "80:80"
    volumes:
      - ./web-server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-server/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
  dashboard:
    build: ./dashboard          # תיקייה עם Dockerfile + קוד ה-React
    container_name: sec_dashboard
    ports:
      - "5173:5173"             # Vite dev server (or 80 if you build+nginx)
    environment:
      - VITE_ES_BASE=http://elasticsearch:9200
      - VITE_APP_INDEX=project_logs
      - VITE_NGINX_INDEX=project_logs
      - VITE_POLL_MS=10000
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
volumes:
  esdata:
  kafka_kraft: